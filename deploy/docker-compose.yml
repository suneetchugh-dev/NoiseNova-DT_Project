# Noise Nova on a single VM (EC2, Lightsail, Azure VM).
#
#   cd deploy && docker compose up -d --build
#
# Caddy terminates TLS on 80/443 and proxies to the hub; the hub itself is never
# published to the internet.

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      DB_PATH: /data/noise-nova.db
      HUB_TOKEN: ${HUB_TOKEN:-}
    volumes:
      - noise-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  noise-data:
  caddy-data:
  caddy-config:
